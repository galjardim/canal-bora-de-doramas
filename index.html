@media (max-width:950px) { .theme-gallery { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:600px) { .theme-gallery { gap:11px; margin:18px 0 14px; }.theme-poster-caption { min-height:62px; padding:9px 10px; }.theme-poster-caption strong { font-size:15px; }.theme-poster-caption span { font-size:12px; }.theme-extras { flex-wrap:wrap; margin:0; padding:0; }.theme-extras .filter { white-space:nowrap; } }

/* Ajustes de controles nativos para reproduzir o catálogo no Blogger. */
[hidden] { display:none !important; }
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
.catalog-tab-list { display:flex; align-items:stretch; background:transparent; }
.catalog-tab { position:relative; border:0; border-radius:0; background:transparent; cursor:pointer; }
.catalog-tab[data-state="active"]::after { content:"";position:absolute;bottom:0;left:0;right:0;height:3px; }
.catalog-tab:focus-visible,.theme-poster:focus-visible,.artist-card:focus-visible,.actor-trigger:focus-visible,.search-input:focus-visible,.sheet-close:focus-visible { outline:2px solid #9deafa; outline-offset:2px; }
.artist-section .catalog-heading h2 { font-size:clamp(28px,2.7vw,36px);line-height:1.08;margin:0;font-weight:400;letter-spacing:-.03em; }
.search-wrap .search-icon { position:absolute;left:17px;color:#9be2f4;z-index:1;pointer-events:none;font-size:25px;line-height:1;transform:rotate(-25deg); }
.search-input { display:block;width:100%;min-width:0; }
.clear-search[hidden] { display:none; }
.actor-trigger { padding:0 34px 0 13px; cursor:pointer; }
.empty-state { display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:14px;padding:30px; }
.empty-state h3 { font-size:26px;font-weight:400;margin:0; }.empty-state p { color:#bec8e3; }
.reset-button { cursor:pointer;border-radius:9px;background:#202447;padding:11px 17px;font-size:14px; }
.artist-sheet { position:fixed;right:0;top:0;bottom:0;z-index:1002;display:flex;flex-direction:column;overflow:hidden;box-shadow:-20px 0 70px #0009; }
.sheet-backdrop { position:fixed;inset:0;z-index:1001;background:#030713ad; }
body.sheet-open { overflow:hidden; }
.sheet-title { font:400 30px/1.1 Georgia,serif;margin:4px 0; }
.sheet-description { color:#bdc8e3;font-size:14px;margin:0; }
.sheet-close { font-size:28px;line-height:1;cursor:pointer; }
.sheet-link { white-space:normal; }
.blogger-required { display:none !important; }
@media (max-width:520px) { .sheet-title { font-size:25px; }.artist-sheet { width:100vw; } }


/* PWA standalone refinements */
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.install-banner{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:1200;padding:12px 14px;border:1px solid #6e77ad;border-radius:14px;background:#101936ee;box-shadow:0 15px 45px #0009;backdrop-filter:blur(14px);align-items:center;gap:12px}
.install-banner.show{display:flex} .install-banner img{width:48px;height:48px;border-radius:50%} .install-copy{min-width:0;flex:1} .install-copy strong{display:block;font:400 18px Georgia,serif} .install-copy span{display:block;color:#bec8e3;font-size:12px;margin-top:3px} .install-btn,.install-dismiss{border:0;cursor:pointer} .install-btn{border-radius:10px;padding:10px 13px;background:linear-gradient(110deg,#e8a0f2,#7bdbfb);color:#071426;font-weight:700} .install-dismiss{background:transparent;color:#dce9ff;font-size:24px;padding:4px}

.join-channel-wrap { display:flex; justify-content:center; padding:18px 0 0; }
.join-channel-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; max-width:760px; padding:13px 22px; border:1px solid #f2b7ff80; border-radius:999px; background:linear-gradient(135deg,#ecb4fa22,#9fe7ff18); color:#f7eaff; text-decoration:none; font-weight:700; letter-spacing:.01em; box-shadow:0 10px 30px #0003; transition:transform .18s ease,border-color .18s ease,background .18s ease; text-align:center; }
.join-channel-btn:hover { transform:translateY(-2px); border-color:#f2b7ffcc; background:linear-gradient(135deg,#ecb4fa35,#9fe7ff28); }
.join-channel-btn:focus-visible { outline:3px solid #9fe7ff; outline-offset:3px; }
@media (max-width:600px) { .join-channel-wrap { padding-top:14px; }.join-channel-btn { width:100%; padding:12px 16px; font-size:14px; line-height:1.35; } }
.sheet-credit { margin:5px 0 0; color:#aebbd4; font-size:12px; line-height:1.4; }
</style>

<body>
<div id="bora-catalogo"></div>
<div class="install-banner" id="install-banner" aria-live="polite"><img src="icons/icon-192.png" alt=""><div class="install-copy"><strong>Canal Bora de Doramas</strong><span>Instale o catálogo no celular para abrir como app.</span></div><button class="install-btn" id="install-btn" type="button">Instalar</button><button class="install-dismiss" id="install-dismiss" type="button" aria-label="Fechar">×</button></div>
<script src="./catalogo.js?v=3"></script>
<script src="./imagens.js?v=3"></script>
<script>
(function () {
  'use strict';
  const root = document.getElementById('bora-catalogo');
  if (!root) return;
  const artists = CATALOG_ARTISTS;
  const dramas = CATALOG_DRAMAS;
  const images = CATALOG_IMAGES;
  const posters = [
    ['Enemies to lovers', '/theme-enemies.webp'],
    ['Transmigração', '/theme-transmigration.webp'],
    ['Máfia', '/theme-mafia.webp'],
    ['Homens obcecados', '/theme-obsession.webp']
  ];
  const cast = [...new Set(dramas.flatMap(d => d.cast || []))].sort((a,b) => a.localeCompare(b, 'pt-BR'));
  const state = {tab:'artistas', artistQuery:'', group:'Todos', selected:null, listQuery:'', theme:'Enemies to lovers', actor:'Todos', themeQuery:''};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const pic = (path, alt, extra='') => path && images[path] ? `<img src="${images[path]}" alt="${esc(alt)}" ${extra}/>` : '';
  const links = (arr, title, cls) => (arr || []).filter(l => /^https:\/\/t\.me\//.test(l.url)).map(l => `<a class="${cls}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc((l.label === 'Telegram' ? 'Abrir' : l.label) + ': ' + title + ' no Telegram (nova aba)')}">${esc(l.label === 'Telegram' ? 'Abrir no Telegram' : l.label)}<span aria-hidden="true">↗</span></a>`).join('');

  root.innerHTML = `<main class="site-shell">
    <header class="topbar"><div class="brand" aria-label="Canal Bora de Doramas">${pic('/bora-logo.webp','', 'class="brand-logo"')}<span class="brand-name">BORA DE <em>DORAMAS</em></span></div><span class="topbar-label">CATÁLOGO DE SHORT DRAMAS</span></header>
    <div class="main-wrap"><section class="intro" aria-labelledby="page-title"><div class="intro-art" aria-hidden="true"></div><div class="intro-content"><span class="eyebrow">CANAL BORA DE DORAMAS <span aria-hidden="true">✦</span> BY @GAL_HUAYUAN</span><h1 id="page-title">Catálogo de <i>short dramas</i></h1></div></section>
    <div class="join-channel-wrap"><a class="join-channel-btn" href="https://t.me/+2QcvTDzUth0wMzkx" target="_blank" rel="noopener noreferrer">🌸 Se você ainda não faz parte do CANAL <em>BORA DE DORAMAS</em>, clique aqui.</a></div>
    <div class="catalog-tabs"><div class="catalog-tab-list" role="tablist" aria-label="Explorar catálogo"><button type="button" class="catalog-tab" data-tab="artistas" id="tab-artistas" role="tab" aria-controls="painel-artistas">Por artista</button><button type="button" class="catalog-tab" data-tab="temas" id="tab-temas" role="tab" aria-controls="painel-temas">Por tema</button></div>
      <div id="painel-artistas" role="tabpanel" aria-labelledby="tab-artistas"><section class="artist-section" aria-labelledby="artists-title"><div class="catalog-heading"><h2 id="artists-title">Atores e atrizes</h2><p class="result-count" id="artist-count" role="status" aria-live="polite"></p></div><div class="artist-controls"><div class="search-wrap artist-search"><span class="search-icon" aria-hidden="true">⌕</span><label class="sr-only" for="artist-search">Buscar artista ou drama</label><input id="artist-search" class="search-input" type="search" placeholder="Buscar artista ou drama"/><button type="button" class="clear-search" data-clear="artist-search" aria-label="Limpar busca" hidden>×</button></div><div class="artist-groups" role="group" aria-label="Filtrar artistas" id="artist-groups"></div></div><div class="artist-grid" id="artist-grid"></div><div class="empty-state" id="artist-empty" hidden><h3>Nenhum perfil encontrado</h3><p>Tente outro nome ou título.</p><button type="button" class="reset-button" data-reset="artists">Ver todos os artistas</button></div></section></div>
      <div id="painel-temas" role="tabpanel" aria-labelledby="tab-temas" hidden><section class="catalog" aria-labelledby="catalog-title"><div class="catalog-heading"><h2 id="catalog-title">Explore por tema</h2><p class="result-count" id="theme-count" role="status" aria-live="polite"></p></div><div class="theme-gallery" role="group" aria-label="Selecionar lista temática" id="theme-gallery"></div><div class="filters theme-extras" role="group" aria-label="Outras opções de tema" id="theme-extras"></div><div class="controls"><div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><label class="sr-only" for="catalog-search">Buscar título, tema ou elenco</label><input id="catalog-search" class="search-input" type="search" placeholder="Buscar título, tema ou elenco"/><button type="button" class="clear-search" data-clear="catalog-search" aria-label="Limpar busca" hidden>×</button></div><label class="actor-filter" for="actor-select"><span>Ator/atriz</span><select id="actor-select" class="actor-trigger"><option value="Todos">Todos</option>${cast.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></label></div><div class="card-grid" id="drama-grid"></div><div class="empty-state" id="theme-empty" hidden><h3>Nenhum título encontrado</h3><p>Tente outra busca ou ajuste os filtros.</p><button type="button" class="reset-button" data-reset="themes">Ver todos os títulos</button></div></section></div></div>
    <footer>CANAL BORA DE DORAMAS <span>·</span> BY @GAL_HUAYUAN</footer></div>
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div><aside class="artist-sheet" id="artist-sheet" role="dialog" aria-modal="true" aria-label="Lista de dramas" hidden></aside></main>`;
  root.querySelector('.intro-art').style.backgroundImage = `linear-gradient(90deg,#07132bd9 0%,#111938a8 38%,#11355745 68%,#061d3030 100%),url("${images['/brand-landscape.webp']}")`;

  const el = id => document.getElementById(id);
  let previousFocus;
  function renderTabs() {
    for (const tab of ['artistas','temas']) {
      const button = el('tab-'+tab), active = tab === state.tab;
      button.dataset.state = active ? 'active':'inactive';
      button.setAttribute('aria-selected',String(active));
      button.tabIndex = active ? 0 : -1;
      el('painel-'+tab).hidden = !active;
    }
  }
  function renderArtists() {
    const term = norm(state.artistQuery.trim());
    const found = artists.filter(a => (state.group === 'Todos' || a.kind === (state.group === 'Atrizes' ? 'Atriz':'Ator')) && (!term || norm(a.name).includes(term) || a.dramas.some(d => norm(d.title).includes(term))));
    el('artist-count').textContent = `${found.length} ${found.length === 1 ? 'perfil':'perfis'}`;
    el('artist-groups').innerHTML = ['Todos','Atrizes','Atores'].map(g => `<button type="button" class="filter ${state.group === g ? 'selected':''}" data-group="${g}" aria-pressed="${state.group === g}">${g}<span class="filter-count">${g === 'Todos' ? artists.length : artists.filter(a => a.kind === (g === 'Atrizes'?'Atriz':'Ator')).length}</span></button>`).join('');
    el('artist-grid').innerHTML = found.map(a => `<button class="artist-card" type="button" data-artist="${esc(a.name)}" aria-label="Ver lista de ${esc(a.name)}"><div class="artist-photo">${a.image && images[a.image] ? pic(a.image,`Arte de ${a.name} para o Canal Bora de Doramas`,'loading="lazy"') : `<span class="artist-initials" aria-hidden="true">${esc(a.name.split(' ').map(s=>s[0]).join('').slice(0,2))}</span>`}</div><div class="artist-card-info"><span class="artist-kind">${esc(a.kind)}</span><strong>${esc(a.name)}</strong><span class="artist-count">${a.dramas.length ? `${a.dramas.length} ${a.dramas.length === 1?'drama':'dramas'}`:'Lista em preparação'}</span></div></button>`).join('');
    el('artist-grid').hidden = !found.length;
    el('artist-empty').hidden = !!found.length;
  }
  function renderThemes() {
    el('theme-gallery').innerHTML = posters.map(([name,path]) => `<button type="button" class="theme-poster ${state.theme === name?'selected':''}" data-theme="${esc(name)}" aria-pressed="${state.theme === name}">${pic(path,'','loading="lazy"')}<span class="theme-poster-caption"><strong>${esc(name)}</strong><span>${dramas.filter(d=>d.themes.includes(name)).length} títulos</span></span></button>`).join('');
    el('theme-extras').innerHTML = ['Todos','Sem tema confirmado'].map(name => `<button type="button" class="filter ${state.theme === name?'selected':''}" data-theme="${esc(name)}" aria-pressed="${state.theme === name}">${esc(name)}<span class="filter-count">${name === 'Todos' ? dramas.length : dramas.filter(d=>d.themes.includes(name)).length}</span></button>`).join('');
    const term = norm(state.themeQuery.trim());
    const found = dramas.filter(d => (state.theme === 'Todos' || d.themes.includes(state.theme)) && (state.actor === 'Todos' || (d.cast||[]).includes(state.actor)) && (!term || norm([d.title,d.alternateTitle||'',...(d.aliases||[]),...d.themes,...(d.cast||[]),d.year||''].join(' ')).includes(term)));
    el('theme-count').textContent = `${found.length} ${found.length === 1?'título':'títulos'}`;
    el('drama-grid').innerHTML = found.map((d,i) => {
      const kind = d.themes.includes('Máfia')?'mafia':d.themes.includes('Homens obcecados')?'obsession':d.themes.includes('Transmigração')?'transmigration':'enemies';
      const details = [d.cast && d.cast.join(' × '),d.year,d.note].filter(Boolean).join(' · ');
      return `<article class="drama-card ${kind}"><div class="card-top"><span class="card-number">${String(i+1).padStart(2,'0')}</span><span class="card-ornament" aria-hidden="true">✦</span></div><div class="card-content"><span class="theme-label">${esc(d.themes.join(' · '))}</span><h3>${esc(d.title)}</h3>${d.alternateTitle?`<p class="alternate-title">${esc(d.alternateTitle)}</p>`:''}${details?`<p class="actor">${esc(details)}</p>`:''}</div><div class="card-actions">${links(d.links,d.title,'card-link')||'<span class="link-pending">Link a confirmar</span>'}</div></article>`;
    }).join('');
    el('drama-grid').hidden = !found.length;
    el('theme-empty').hidden = !!found.length;
  }
  function renderSheet() {
    const a = state.selected;
    if (!a) { el('artist-sheet').hidden = true; el('sheet-backdrop').hidden = true; document.body.classList.remove('sheet-open'); return; }
    const matches = a.dramas.filter(d=>norm(d.title).includes(norm(state.listQuery.trim())));
    el('artist-sheet').innerHTML = `<div class="artist-sheet-header"><div class="sheet-heading"><div class="sheet-thumbnail">${a.image && images[a.image] ? pic(a.image,'') : `<span aria-hidden="true">${esc(a.name[0])}</span>`}</div><div><span class="artist-kind">${esc(a.kind)}</span><h2 class="sheet-title">${esc(a.name)}</h2><p class="sheet-description">${a.dramas.length} ${a.dramas.length === 1?'short drama na lista':'short dramas na lista'}</p>${a.credit?`<p class="sheet-credit">${esc(a.credit)}</p>`:''}</div></div><button class="sheet-close" type="button" data-close="sheet" aria-label="Fechar lista">×</button></div>${a.dramas.length ? `<div class="sheet-search search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><label class="sr-only" for="drama-list-search">Buscar drama nesta lista</label><input id="drama-list-search" class="search-input" type="search" placeholder="Buscar nesta lista" value="${esc(state.listQuery)}"/><button type="button" class="clear-search" data-clear="drama-list-search" aria-label="Limpar busca da lista" ${state.listQuery?'':'hidden'}>×</button></div><div class="sheet-results" role="status" aria-live="polite">${matches.length} ${matches.length === 1?'resultado':'resultados'}</div><div class="sheet-list" tabindex="0">${matches.length ? `<ol>${matches.map((d,i)=>`<li class="sheet-drama"><span class="sheet-number">${String(i+1).padStart(2,'0')}</span><div class="sheet-drama-main"><h3>${esc(d.title)}</h3><div class="sheet-links">${links(d.links,d.title,'sheet-link')}</div></div></li>`).join('')}</ol>`:'<p class="sheet-empty">Nenhum drama encontrado nesta lista.</p>'}</div>`:'<div class="sheet-no-list">A arte já está no catálogo. Ainda não há uma lista de títulos confirmada para este artista.</div>'}`;
    el('artist-sheet').hidden = false; el('sheet-backdrop').hidden = false; document.body.classList.add('sheet-open');
  }
  function closeSheet() { state.selected=null; renderSheet(); if (previousFocus && previousFocus.isConnected) previousFocus.focus(); }
  root.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]'); if (tab) { state.tab=tab.dataset.tab; renderTabs(); return; }
    const group = e.target.closest('[data-group]'); if (group) { state.group=group.dataset.group; renderArtists(); return; }
    const theme = e.target.closest('[data-theme]'); if (theme) { state.theme=theme.dataset.theme; renderThemes(); return; }
    const artist = e.target.closest('[data-artist]'); if (artist) { previousFocus=artist; state.selected=artists.find(a=>a.name===artist.dataset.artist); state.listQuery=''; renderSheet(); el('artist-sheet').querySelector('.sheet-close').focus(); return; }
    if (e.target.closest('[data-close]') || e.target.id === 'sheet-backdrop') { closeSheet(); return; }
    const clear = e.target.closest('[data-clear]'); if (clear) { const input=el(clear.dataset.clear); input.value=''; input.dispatchEvent(new Event('input',{bubbles:true})); input.focus(); return; }
    const reset = e.target.closest('[data-reset]'); if (reset) { if (reset.dataset.reset==='artists') { state.artistQuery='';state.group='Todos';el('artist-search').value='';renderArtists(); } else { state.themeQuery='';state.actor='Todos';state.theme='Todos';el('catalog-search').value='';el('actor-select').value='Todos';renderThemes(); } return; }
  });
  root.addEventListener('input', e => {
    if (e.target.id==='artist-search') { state.artistQuery=e.target.value; renderArtists(); }
    if (e.target.id==='catalog-search') { state.themeQuery=e.target.value; renderThemes(); }
    if (e.target.id==='drama-list-search') { const caret=e.target.selectionStart; state.listQuery=e.target.value; renderSheet(); const input=el('drama-list-search');input.focus();input.setSelectionRange(caret,caret); }
    if (e.target.matches('.search-input')) { const clear=root.querySelector(`[data-clear="${e.target.id}"]`); if (clear) clear.hidden=!e.target.value; }
  });
  el('actor-select').addEventListener('change',e=>{state.actor=e.target.value;renderThemes();});
  document.addEventListener('keydown',e=>{
    if (e.key==='Escape' && state.selected) closeSheet();
    if (state.selected && e.key==='Tab') {
      const focusable=[...el('artist-sheet').querySelectorAll('button:not([hidden]),input,a[href],[tabindex="0"]')];
      const first=focusable[0],last=focusable[focusable.length-1];
      if (e.shiftKey && document.activeElement===first) {e.preventDefault();last.focus();}
      else if (!e.shiftKey && document.activeElement===last) {e.preventDefault();first.focus();}
    }
  });
  el('tab-artistas').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();el('tab-temas').click();el('tab-temas').focus();}});
  el('tab-temas').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();el('tab-artistas').click();el('tab-artistas').focus();}});
  renderTabs(); renderArtists(); renderThemes();
})();


</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
let deferredPrompt=null; const ib=document.getElementById('install-banner'), btn=document.getElementById('install-btn'), dis=document.getElementById('install-dismiss');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;ib.classList.add('show')});
btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.classList.remove('show')});
dis.addEventListener('click',()=>ib.classList.remove('show'));
window.addEventListener('appinstalled',()=>ib.classList.remove('show'));
</script>
</body>
